<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Austin Hutchinson WDD231 Project Chamber of Commerce Index Home">
    <meta name="author" content="Austin hutchinson">

    <meta property="og:url" content="https://https://johnvak01.github.io/wdd231/chamber/directory">
    <meta property="og:title" content="Sandy Chamber of Commerce">
    <meta property="og:description" content="The Chamber of Commerce site for the city of Sandy,Utah.">
    <meta property="og:image" content="https://johnvak01.github.io/wdd231/images/logo.svg">
    <meta property="og:local" content="en_US">

    <title>Sandy Chamber of Commerce</title>
    <link rel="icon" href="images/favicon.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Open+Sans&display=swap" rel="stylesheet">

    <link href="styles/normalize.css" rel="stylesheet">
    <link href="styles/small.css" rel="stylesheet">
    <link href="styles/large.css" rel="stylesheet">

    <script src="scripts/navigation.js" defer=""></script>
    <script src="scripts/date.js" defer=""></script>
    <script src="scripts/join.js" defer=""></script>
</head>

<body>
    <header>
        <img src="images/sandy-logo.webp" alt="site logo" width="116" height="89" id="logo">
        <span>Sandy Chamber of Commerce</span>
        <button id="nav-btn" class="nav-ham" aria-label="navigation"></button>
        <nav id="nav-bar" class="navigation">
            <ul>
                <li><a href="https://johnvak01.github.io/wdd231/chamber/index">Home</a></li>
                <li><a href="https://johnvak01.github.io/wdd231/chamber/directory">Directory</a></li>
                <li class="curent-nav"><a href="https://johnvak01.github.io/wdd231/chamber/join">Join</a></li>
                <li><a href="#">Discover</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Home</h1>
        <div id="hero-sec">
            <img id="hero-image" src="images/sandy-hero.webp" alt="Sandy City Hall" width="320" height="180"
                fetchpriority="high">
            <div id="hero-call"><a href="#">Join Our Community</a></div>
        </div>
        <section id="join-form">
            <h2>Join Us!</h2>
            <form method="get" action="thankyou.html">
                <fieldset>
                    <legend>Join the Sandy Chamber of Commerce</legend>
                    <!-- Fields -->
                    <label>First Name<span class="required_asterisk">*</span>
                        <input type="text" name="name-first" placeholder="John" autocomplete="given-name" title="Your given name"
                            required></label>
                    <label>Last Name<span class="required_asterisk">*</span>
                        <input type="text" name="name-last" placeholder="Doe" autocomplete="family-name" title = "Your family name" required></label>
                    <label>Organizational Title<span class="required_asterisk">*</span>
                        <input type="text" name="title-position" placeholder="" autocomplete="organization-title" title="Your position's title" required></label>
                    <label>Email<span class="required_asterisk">*</span>
                        <input type="email" name="email" placeholder="John" autocomplete="email" title="Your contact email" required></label>
                    <label>Phone<span class="required_asterisk">*</span>
                        <input type="tel" name="phone" placeholder="John" autocomplete="mobile" title="Your contact phone number(mobile)" required></label>
                    <label>Organization Name<span class="required_asterisk">*</span>
                        <input type="text" name="org-name" placeholder="John" autocomplete="organization" title="Your organization's name" required></label>
                    <label>Organization Description<span class="required_asterisk">*</span>
                        <input type="text" name="title-position" placeholder="John" required></label>
                    <label>Organization Description<span class="required_asterisk">*</span>
                        <textarea name="org-description" title="A brief desctiption of your organization"></textarea>
                    </label>
                    <label>Membership Tier<span class="required_asterisk">*</span>
                        <select name="tier" id="form_tier" required>
                            <option disabled selected value="">Select a Tier ...</option>
                            <option value="np">NP membership</option>
                            <option value="bronze">Bronze Membership</option>
                            <option value="silver">Silver membership</option>
                            <option value="gold">Gold Membership</option>
                        </select></label>
                    <div class="button-div">
                        <button type="submit" id="button_save">Save Character</button>
                        <input type="button" name="randomize" value="Randomize Character" id="button_rand"></input>
                    </div>
                </fieldset>
        </section>
    </main>
    <footer>
        <div class="social">
            <ul>
                <li><a href="https://www.linkedin.com" target="_blank"><img src="images/linkedin.svg" width="44"
                            height="44" class="svg" alt="linkein"></a></li>
                <li><a href="https://www.github.com" target="_blank"><img src="images/github.svg" width="44" height="44"
                            class="svg" alt="github"></a></li>
                <li><a href="https://www.wordpress.com" target="_blank"><img src="images/wordpress.svg" width="44"
                            height="44" class="svg" alt="wordpress"></a></li>
                <li><a href="https://www.youtube.com" target="_blank"><img src="images/youtube.svg" width="44"
                            height="44" class="svg" alt="youtube"></a></li>
            </ul>
        </div>
        <p><span id="currentyear"></span> | J Austin Hutchinson | UT, USA</p>
        <span id="lastModified"></span>
    </footer>
</body>

</html>
