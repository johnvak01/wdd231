<body>
  <header>
    <img src="images/logo.svg" alt="site logo" width="89" height="89" id="logo">
    <span>TTRPG Handout Generators</span>
    <button id="nav-btn" class="nav-ham" aria-label="navigation"></button>

  <nav id="nav-bar" class="navigation">
    <ul>
      <li><a href="index.html">Index</a></li>
      <li class="current-nav"><a href="generate.html">Generate</a></li>
      <li><a href="browse.html">Browse</a></li>
    </ul>
  </nav>
  <main>
    <div class="header-box">
      <h1>TTRPG Handout Generator</h1>
      <p>Optional domain name: rpg-gen.com</p>
      <p>This site provides generators for pre-formatted handouts for use in a TTRPG campaign.</p>
    </div>
    <section id="sec-form">
      <h2>Make An Article</h2>
      <form action="browse.html" method="get" onsubmit="return saveEntry()" id="form-gen">
        <fieldset class="form-article">
          <legend>Article Entry</legend>
          <label>Article Title
            <input type="text" id="article-title" placeholder="Title..." title="Your Article's Title" required></label>
          <label>Article Sub-title
            <input type="text" id="article-sub-title" placeholder="Sub-Title..." title="Your Article's Sub-Title"
              required></label>
          <label>Article Authorship
            <input type="text" id="article-author" placeholder="Author-name..." title="Your Article's Title"
              required></label>
          <label>Article Content
            <textarea type="text" id="article-content" placeholder="Article Content" title="Your Article's Content"
              required></textarea></label>
          <input hidden type="number" name="id-number" id="id-number">
        </fieldset>
        <button type="button" id="button-preview">Preview Entry</button>
        <button type="submit" id="button-save">Save Entry</button>
      </form>
    </section>
  </main>
  <footer>
    <div class="social">
