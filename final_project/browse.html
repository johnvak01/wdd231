  <main>
    <div class="header-box">
      <h1>TTRPG Handout Generators</h1>
      <p>Optional domain name: rpg-gen.com</p>
      <p>This site provides generators for pre-formatted handouts for use in a TTRPG campaign.</p>
    </div>
    <section>
      <h2>Formatting</h2>
      <form action="final.html" method="get" onsubmit="return verifySelection()">
        <fieldset id="form-newspaper">
          <legend>Article Entry</legend>
          <label>Sheet Layout
            <select name="select-layout" id="select-layout" required>
              <option disabled selected>Choose a page layout</option>
              <option value="1">1 Article Layout</option>
              <option value="15">15 Article Layout</option>
            </select>
          </label>
          <fieldset id="form-articles">
            <legend>Selected Articles x/15</legend>
          </fieldset>
          <button type="submit" id="button-preview">Create Layout</button>
        </fieldset>
      </form>
    </section>
  </main>
